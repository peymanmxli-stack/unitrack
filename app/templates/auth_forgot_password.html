<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | UniTrack</title>

<style>

/*
auth_forgot_password.html
*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    background:white;
    color:#1f2937;
    overflow-x:hidden;
    position:relative;
}

.top-strip{
    width:100%;
    height:90px;
    background:linear-gradient(90deg,#7a0019,#5f0014);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:14px;
    color:white;
}

.header-upbc{
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
}

.header-university{
    font-size:14px;
    font-weight:600;
    opacity:0.9;
}

.header-logos{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-logos img{
    height:44px;
    background:white;
    padding:6px 10px;
    border-radius:10px;
}

.corner-unitrack{
    position:absolute;
    top:95px;
    left:10px;
    width:260px;
    height:260px;
    object-fit:contain;
}

.corner-baja{
    position:absolute;
    top:95px;
    right:40px;
    width:260px;
    height:260px;
    object-fit:contain;
}

.page-wrap{
    min-height:calc(100vh - 78px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 0;
}

.page-shell{
    width:100%;
    max-width:420px;
    padding:0;
}

.forgot-card{
    width:100%;
    background:linear-gradient(160deg,#2b0a3d,#4c1d95,#6d28d9);
    border-radius:22px;
    padding:30px;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
    color:white;
}

.card-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:20px;
    text-align:center;
    color:#ffffff;
}

.card-subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:22px;
    line-height:1.6;
}

.error,
.success{
    margin-bottom:14px;
    padding:12px;
    border-radius:12px;
    font-size:14px;
    text-align:center;
}

.error{
    background:rgba(239,68,68,0.12);
    border:1px solid rgba(239,68,68,0.28);
    color:#fecaca;
}

.success{
    background:rgba(34,197,94,0.12);
    border:1px solid rgba(34,197,94,0.28);
    color:#bbf7d0;
}

.form-group{
    margin-bottom:16px;
}

.form-label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:700;
    color:#ffffff;
}

.form-input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:15px;
    outline:none;
    transition:0.2s ease;
    min-height:52px;
}

.form-input::placeholder{
    color:#e9d5ff;
}

.form-input:focus{
    background:rgba(255,255,255,0.18);
}

.button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:10px;
}

.primary-button,
.secondary-button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#38bdf8,#22c55e);
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:0.2s;
    text-decoration:none;
    display:block;
    text-align:center;
}

.primary-button:hover,
.secondary-button:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 24px rgba(0,0,0,0.25);
}

.helper-note{
    margin-top:18px;
    text-align:center;
    font-size:12px;
    color:#e9d5ff;
    line-height:1.6;
}

@media (max-width: 700px){
    .corner-unitrack,
    .corner-baja{
        width:180px;
        height:180px;
    }
}

@media (max-width: 520px){
    .page-shell{
        max-width:100%;
        padding:18px;
    }

    .forgot-card{
        padding:22px;
        border-radius:18px;
    }

    .button-row{
        grid-template-columns:1fr;
    }

    .corner-unitrack{
        width:120px;
        height:120px;
        top:100px;
        left:6px;
    }

    .corner-baja{
        width:120px;
        height:120px;
        top:100px;
        right:6px;
    }
}

</style>
</head>
<body>

<div class="top-strip">

    <div class="header-left">
        <div class="header-upbc">UPBC</div>
        <div class="header-university">
            Universidad Politécnica de Baja California
        </div>
    </div>

    <div class="header-logos">
        <img src="{{ url_for('static', filename='img/sep.png') }}">
        <img src="{{ url_for('static', filename='img/baja_california.png') }}">
        <img src="{{ url_for('static', filename='img/utyp.png') }}">
    </div>

</div>

<img src="{{ url_for('static', filename='img/unitrack_logo.png') }}" class="corner-unitrack">
<img src="{{ url_for('static', filename='img/upbc_official.png') }}" class="corner-baja">

<div class="page-wrap">

    <div class="page-shell">

        <div class="forgot-card">

            <div class="card-title">Forgot Password</div>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            {% if success_message %}
                <div class="success">{{ success_message }}</div>
            {% endif %}

            <form method="POST" action="/auth/forgot-password">

                <div class="form-group">
                    <label class="form-label" for="email">Registered Email</label>
                    <input
                        id="email"
                        type="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your registered email"
                        value="{{ email or '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Registered Phone Number</label>
                    <input
                        id="phone"
                        type="text"
                        name="phone"
                        class="form-input"
                        placeholder="Enter your registered phone number"
                        value="{{ phone or '' }}"
                        required
                    >
                </div>

                <div class="button-row">
                    <button type="submit" class="primary-button">
                        Send Email
                    </button>

                    <a href="/auth/login-page" class="secondary-button">
                        Return
                    </a>
                </div>

            </form>

            <div class="helper-note">
                For security reasons, the reset request only works when both email and phone number match the same UniTrack account.
            </div>

        </div>

    </div>

</div>

</body>
</html>
